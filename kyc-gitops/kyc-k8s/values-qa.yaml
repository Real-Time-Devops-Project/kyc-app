# QA Environment Values
environment: qa
replicaCount: 2
serviceAccount:
  annotations:
    # Set this to terraform output kyc_app_irsa_role_arn before enabling IAM DB auth.
    eks.amazonaws.com/role-arn: ""
database:
  postgres:
    iamAuthEnabled: false
  docdb:
    mongoUriSecretArn: ""
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
