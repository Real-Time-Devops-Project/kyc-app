{{- if eq .Release.Name "kyc-vkyc-service" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
    env: {{ .Values.environment }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
      - name: {{ .Release.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 3002
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: PORT
          value: "3002"
        - name: PG_HOST
          value: "{{ .Values.environment }}-postgres"
        - name: PG_IAM_AUTH_ENABLED
          value: "{{ .Values.database.postgres.iamAuthEnabled }}"
        - name: AWS_REGION
          value: "{{ .Values.aws.region }}"
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: pg-user
        {{- if not .Values.database.postgres.iamAuthEnabled }}
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: pg-password
        {{- end }}
        - name: PG_DATABASE
          value: "kyc_{{ .Values.environment }}"
        {{- if .Values.database.docdb.mongoUriSecretArn }}
        - name: MONGO_URI_SECRET_ARN
          value: "{{ .Values.database.docdb.mongoUriSecretArn }}"
        {{- else }}
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: mongo-uri
        {{- end }}
        - name: REDIS_URL
          value: "redis://{{ .Values.environment }}-redis:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
  - port: 80
    targetPort: 3002
{{- end -}}
