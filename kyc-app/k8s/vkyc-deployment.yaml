apiVersion: apps/v1
kind: Deployment
metadata:
  name: vkyc-service
  labels:
    app: vkyc-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vkyc-service
  template:
    metadata:
      labels:
        app: vkyc-service
    spec:
      containers:
      - name: vkyc-service
        image: vkyc-service:latest # Replace with actual registry image
        ports:
        - containerPort: 3002
        env:
        - name: PORT
          value: "3002"
        - name: PG_HOST
          value: "postgres-service"
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: pg-user
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: pg-password
        - name: PG_DATABASE
          value: "appdb"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: mongo-uri
        - name: REDIS_URL
          value: "redis://redis-service:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: vkyc-service
spec:
  selector:
    app: vkyc-service
  ports:
  - port: 80
    targetPort: 3002
