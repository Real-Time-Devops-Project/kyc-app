apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyc-frontend
  labels:
    app: kyc-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kyc-frontend
  template:
    metadata:
      labels:
        app: kyc-frontend
    spec:
      containers:
      - name: kyc-frontend
        image: kyc-frontend:latest # Replace with actual registry image
        ports:
        - containerPort: 80
        env:
        - name: VITE_EKYC_URL
          value: "http://ekyc-service"
        - name: VITE_VKYC_URL
          value: "http://vkyc-service"
---
apiVersion: v1
kind: Service
metadata:
  name: kyc-frontend
spec:
  type: LoadBalancer
  selector:
    app: kyc-frontend
  ports:
  - port: 80
    targetPort: 80
