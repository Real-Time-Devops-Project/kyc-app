apiVersion: apps/v1
kind: Deployment
metadata:
  name: ekyc-service
  labels:
    app: ekyc-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ekyc-service
  template:
    metadata:
      labels:
        app: ekyc-service
    spec:
      containers:
      - name: ekyc-service
        image: ekyc-service:latest # Replace with actual registry image
        ports:
        - containerPort: 3001
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: PORT
          value: "3001"
        - name: PG_HOST
          value: "postgres-service" # Adjust based on actual RDS endpoint or service
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: pg-user
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: pg-password
        - name: PG_DATABASE
          value: "appdb"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: mongo-uri
        - name: REDIS_URL
          value: "redis://redis-service:6379" # Adjust based on ElastiCache
---
apiVersion: v1
kind: Service
metadata:
  name: ekyc-service
spec:
  selector:
    app: ekyc-service
  ports:
  - port: 80
    targetPort: 3001
