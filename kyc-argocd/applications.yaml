apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyc-app-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/YOUR_ORG/kyc-app.git' # UPDATE THIS
    targetRevision: main
    path: kyc-k8s
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: prod
  syncPolicy:
    automated:
      prune: false # PROD usually manual sync for safety
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
