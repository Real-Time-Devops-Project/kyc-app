apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyc-app-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/YOUR_ORG/kyc-app.git' # UPDATE THIS
    targetRevision: dev
    path: kyc-k8s
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
