name: Atlantis Self Serve - Plan

on:
  #pull_request:
    #branches:
    #  - main
     # - dev
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'kyc-terraform/**'
      - '.github/workflows/atlantis-terraform-plan.yml'
      - '.github/workflows/atlantis-terraform-apply.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: atlantis-terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: true

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: DevSecOps - Checkov Scan
        uses: bridgecrewio/checkov-action@master
        continue-on-error: true
        with:
          directory: kyc-terraform
          framework: terraform
          soft_fail: true

      - name: DevSecOps - Cloud Custodian Validation
        continue-on-error: true
        run: |
          pip install c7n
          for policy in kyc-custodian/policies/*.yml; do
            custodian validate $policy
          done

      - name: DevSecOps - Prowler AWS Scan (Targeted)
        continue-on-error: true
        run: |
          pip install prowler
          # Running a targeted scan to prevent 15+ min delays in PR
          prowler aws --services iam --quiet

      - name: DevSecOps - Steampipe Compliance Check
        continue-on-error: true
        run: |
          sudo /bin/sh -c "$(curl -fsSL https://raw.githubusercontent.com/turbot/steampipe/main/install.sh)"
          steampipe plugin install aws
          steampipe query "select account_id from aws_account"

      - name: DevSecOps - CloudQuery Integration
        continue-on-error: true
        run: |
          curl -L https://github.com/cloudquery/cloudquery/releases/download/cli-v3.29.1/cloudquery_linux_amd64 -o cloudquery
          chmod +x cloudquery
          ./cloudquery --version

      - name: Terraform Init
        working-directory: kyc-terraform/environments/prod
        run: bash ../../scripts/tf-init.sh

      - name: Run Terraform Plan
        id: plan
        working-directory: kyc-terraform/environments/prod
        continue-on-error: true
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan > tfplan.json

      - name: Create human-readable plan summary
        id: summary
        working-directory: kyc-terraform/environments/prod
        run: |
          python3 ../../scripts/human_summary.py tfplan.json "${{ env.AWS_REGION }}" > tfplan-summary.md
          cat tfplan-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan summary on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('kyc-terraform/environments/prod/tfplan-summary.md', 'utf8');
            const marker = '<!-- atlantis-plan-summary -->';
            const body = `${marker}\n## 🗺️ Atlantis Self-Serve Plan\n\n${summary}`;
            
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(comment => comment.body?.includes(marker));
            
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: |
          echo "::error::Terraform Plan Failed!"
          exit 1
