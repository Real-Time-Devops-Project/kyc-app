name: Terraform Deploy

# Run automatically when Terraform changes, and manually when an operator wants to trigger deployment.
on:
  push:
    branches:
      - main
    paths:
      - 'kyc-terraform/**'
      - '.github/workflows/terraform-deploy.yml'
  pull_request:
    paths:
      - 'kyc-terraform/**'
      - '.github/workflows/terraform-deploy.yml'
  workflow_dispatch:
    inputs:
      run_observed_state_scans:
        description: 'Run Prowler, CloudQuery, Steampipe, and Custodian after deploy'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  # id-token is required for GitHub OIDC authentication into AWS.
  contents: read
  id-token: write

env:
  # Secrets become Terraform variables because they use the TF_VAR_ prefix.
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: true
  TF_VAR_postgres_password: ${{ secrets.TF_VAR_POSTGRES_PASSWORD }}
  TF_VAR_docdb_password: ${{ secrets.TF_VAR_DOCDB_PASSWORD }}

jobs:
  terraform:
    name: Define, Detect, Deploy
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        # Most Terraform commands run from the prod root module.
        working-directory: kyc-terraform/environments/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        # Assumes an AWS IAM role trusted by this repository through GitHub OIDC.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform fmt
        # Intended state check: verify all Terraform files are consistently formatted.
        working-directory: kyc-terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        # Connect Terraform to providers and the configured remote state backend.
        run: terraform init -input=false

      - name: Terraform validate
        # Validate syntax and provider/module wiring before planning.
        run: terraform validate

      - name: Install Checkov
        # Checkov scans Terraform for insecure cloud configuration before deployment.
        run: pipx install checkov

      - name: Scan intended state with Checkov
        # Intended state security gate: fail the workflow on high-risk IaC findings.
        working-directory: kyc-terraform
        run: |
          mkdir -p security-reports/checkov
          checkov -d . --framework terraform --output cli --output json --output-file-path security-reports/checkov

      - name: Detect drift
        id: drift
        # Actual state check: detect AWS changes that happened outside Terraform.
        run: |
          set +e
          terraform plan -refresh-only -detailed-exitcode -out=tfdrift
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 0 ]; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          elif [ "$exit_code" -eq 2 ]; then
            echo "status=drifted" >> "$GITHUB_OUTPUT"
            terraform show -no-color tfdrift > drift-report.txt
          else
            exit "$exit_code"
          fi

      - name: Terraform plan
        # Create the deployment plan that will be uploaded for review and then applied.
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > tfplan.txt

      - name: Upload plans and reports
        # Preserve plan, drift, and scan evidence for review/audit.
        uses: actions/upload-artifact@v4
        with:
          name: terraform-deploy-reports
          path: |
            kyc-terraform/environments/prod/tfplan.txt
            kyc-terraform/environments/prod/drift-report.txt
            kyc-terraform/security-reports/**
          if-no-files-found: ignore

      - name: Terraform apply
        # Update actual AWS state only for non-PR runs on main.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Install observed-state tools
        # Runtime/cloud-state tools are installed only when observed-state scans will run.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.run_observed_state_scans == 'true')
        working-directory: kyc-terraform
        run: |
          pipx install prowler
          pipx install c7n
          curl -sL https://github.com/cloudquery/cloudquery/releases/latest/download/cloudquery_linux_amd64 -o /tmp/cloudquery
          chmod +x /tmp/cloudquery
          sudo mv /tmp/cloudquery /usr/local/bin/cloudquery
          sudo /bin/sh -c "$(curl -fsSL https://steampipe.io/install/steampipe.sh)"

      - name: Observe actual cloud state
        # Observed state loop: collect inventory, compliance, and audit-only remediation findings.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.run_observed_state_scans == 'true')
        working-directory: kyc-terraform
        continue-on-error: true
        run: |
          mkdir -p security-reports/prowler security-reports/cloudquery security-reports/steampipe security-reports/custodian
          prowler aws --output-directory security-reports/prowler --status FAIL || true
          cloudquery sync security/cloudquery/aws-source.yml security/cloudquery/file-destination.yml || true
          steampipe plugin install aws
          steampipe query --output json "select account_id, users, groups, roles, policies from aws_iam_account_summary" > security-reports/steampipe/iam-account-summary.json || true
          custodian run --dryrun -s security-reports/custodian security/custodian/policies.yml || true

      - name: Upload observed-state reports
        # Upload observed-state outputs even when an earlier scan exits non-zero.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observed-state-reports
          path: kyc-terraform/security-reports/**
          if-no-files-found: ignore
