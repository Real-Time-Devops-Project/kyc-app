name: Terraform Deploy

# PRs run CI and publish a readable Terraform plan for review.
# Merges to main run CD and wait on the protected GitHub environment approval before apply.
on:
  push:
    branches:
      - main
    paths:
      - 'kyc-terraform/**'
      - '.github/workflows/terraform-deploy.yml'
  pull_request:
    paths:
      - 'kyc-terraform/**'
      - '.github/workflows/terraform-deploy.yml'
  workflow_dispatch:
    inputs:
      aws_region:
        description: 'AWS region for Terraform and observed-state scans'
        required: true
        default: 'us-east-1'
        type: string
      run_observed_state_scans:
        description: 'Run Prowler, CloudQuery, Steampipe, and Custodian after deploy'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  # id-token is required for GitHub OIDC authentication into AWS.
  contents: read
  id-token: write
  issues: write
  pull-requests: write

env:
  AWS_REGION: ${{ inputs.aws_region || 'us-east-1' }}
  TF_IN_AUTOMATION: true

jobs:
  terraform-ci:
    name: PR Plan For Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        # Most Terraform commands run from the prod root module.
        working-directory: kyc-terraform/environments/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        # Assumes an AWS IAM role trusted by this repository through GitHub OIDC.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform fmt
        # Intended state check: verify all Terraform files are consistently formatted.
        working-directory: kyc-terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        # Connect Terraform to providers and the configured remote state backend.
        # tf-init.sh auto-detects branch and sets the correct S3 backend key.
        run: bash ../../scripts/tf-init.sh

      - name: Terraform validate
        # Validate syntax and provider/module wiring before planning.
        run: terraform validate

      - name: Install Checkov
        # Checkov scans Terraform for insecure cloud configuration before deployment.
        run: pipx install checkov

      - name: Scan intended state with Checkov
        # Intended state security gate: fail the workflow on high-risk IaC findings.
        working-directory: kyc-terraform
        run: |
          mkdir -p security-reports/checkov
          checkov -d . --framework terraform --output cli --output json --output-file-path security-reports/checkov

      - name: Detect drift
        id: drift
        # Actual state check: detect AWS changes that happened outside Terraform.
        run: |
          set +e
          terraform plan -refresh-only -detailed-exitcode -out=tfdrift
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 0 ]; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          elif [ "$exit_code" -eq 2 ]; then
            echo "status=drifted" >> "$GITHUB_OUTPUT"
            terraform show -no-color tfdrift > drift-report.txt
          else
            exit "$exit_code"
          fi

      - name: Terraform plan
        # Create the deployment plan that will be uploaded for review and then applied.
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json

      - name: Install tf-summarize
        # tf-summarize converts the JSON Terraform plan into a reviewer-friendly change summary.
        run: |
          curl -sL https://github.com/dineshba/tf-summarize/releases/download/v0.3.10/tf-summarize_linux_amd64.tar.gz -o /tmp/tf-summarize.tar.gz
          tar -xzf /tmp/tf-summarize.tar.gz -C /tmp
          sudo mv /tmp/tf-summarize /usr/local/bin/tf-summarize

      - name: Create readable plan summary
        # This summary is what managers/reviewers can read before approving the PR.
        run: |
          tf-summarize -md tfplan.json > tfplan-summary.md
          cat tfplan-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan summary on PR
        # Put the readable plan directly on the PR so approval can happen in GitHub review.
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('kyc-terraform/environments/prod/tfplan-summary.md', 'utf8');
            const marker = '<!-- terraform-plan-summary -->';
            const body = `${marker}\n## Terraform Plan Summary\n\n${summary}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload plans and reports
        # Preserve plan, drift, and scan evidence for review/audit.
        uses: actions/upload-artifact@v4
        with:
          name: terraform-pr-plan-reports
          path: |
            kyc-terraform/environments/prod/tfplan.txt
            kyc-terraform/environments/prod/tfplan.json
            kyc-terraform/environments/prod/tfplan-summary.md
            kyc-terraform/environments/prod/drift-report.txt
            kyc-terraform/security-reports/**
          if-no-files-found: ignore

  terraform-cd-plan:
    name: Main Plan For Approval
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        # Most Terraform commands run from the prod root module.
        working-directory: kyc-terraform/environments/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        # Assumes an AWS IAM role trusted by this repository through GitHub OIDC.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform fmt
        # Intended state check: verify all Terraform files are consistently formatted.
        working-directory: kyc-terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        # Connect Terraform to providers and the configured remote state backend.
        # tf-init.sh auto-detects branch and sets the correct S3 backend key.
        run: bash ../../scripts/tf-init.sh

      - name: Terraform validate
        # Validate syntax and provider/module wiring before planning.
        run: terraform validate

      - name: Install Checkov
        # Checkov scans Terraform for insecure cloud configuration before deployment.
        run: pipx install checkov

      - name: Scan intended state with Checkov
        # Intended state security gate: fail the workflow on high-risk IaC findings.
        working-directory: kyc-terraform
        run: |
          mkdir -p security-reports/checkov
          checkov -d . --framework terraform --output cli --output json --output-file-path security-reports/checkov

      - name: Detect drift
        id: drift
        # Actual state check: detect AWS changes that happened outside Terraform.
        run: |
          set +e
          terraform plan -refresh-only -detailed-exitcode -out=tfdrift
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 0 ]; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          elif [ "$exit_code" -eq 2 ]; then
            echo "status=drifted" >> "$GITHUB_OUTPUT"
            terraform show -no-color tfdrift > drift-report.txt
          else
            exit "$exit_code"
          fi

      - name: Terraform plan
        # Create the main-branch plan that managers approve before the apply job starts.
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json

      - name: Install tf-summarize
        # tf-summarize converts the JSON Terraform plan into a readable deployment summary.
        run: |
          curl -sL https://github.com/dineshba/tf-summarize/releases/download/v0.3.10/tf-summarize_linux_amd64.tar.gz -o /tmp/tf-summarize.tar.gz
          tar -xzf /tmp/tf-summarize.tar.gz -C /tmp
          sudo mv /tmp/tf-summarize /usr/local/bin/tf-summarize

      - name: Create readable plan summary
        # Keep a human-readable summary in the workflow run before apply.
        run: |
          tf-summarize -md tfplan.json > tfplan-summary.md
          cat tfplan-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plans and reports
        # Preserve plan, drift, and scan evidence for review/audit.
        uses: actions/upload-artifact@v4
        with:
          name: terraform-deploy-reports
          path: |
            kyc-terraform/environments/prod/tfplan
            kyc-terraform/environments/prod/tfplan.txt
            kyc-terraform/environments/prod/tfplan.json
            kyc-terraform/environments/prod/tfplan-summary.md
            kyc-terraform/environments/prod/drift-report.txt
            kyc-terraform/security-reports/**
          if-no-files-found: ignore

  terraform-cd-apply:
    name: Approved Apply And Observe
    needs: terraform-cd-plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Configure required reviewers on the prod environment so approval happens after the plan is available.
    environment: prod
    defaults:
      run:
        working-directory: kyc-terraform/environments/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        # Assumes an AWS IAM role trusted by this repository through GitHub OIDC.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform init
        # Reconnect to providers and remote state before applying the reviewed plan.
        # tf-init.sh auto-detects branch and sets the correct S3 backend key.
        run: bash ../../scripts/tf-init.sh

      - name: Download reviewed plan
        # This is the plan created before manager approval.
        uses: actions/download-artifact@v4
        with:
          name: terraform-deploy-reports
          path: kyc-terraform/deploy-artifacts

      - name: Restore reviewed plan
        # Place the binary plan back in the Terraform root module for apply.
        working-directory: kyc-terraform
        run: cp deploy-artifacts/environments/prod/tfplan environments/prod/tfplan

      - name: Terraform apply
        # Update actual AWS state only after branch protection and prod environment approval.
        run: terraform apply -input=false -auto-approve tfplan

      - name: Install observed-state tools
        # Runtime/cloud-state tools are installed only when observed-state scans will run.
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.run_observed_state_scans == 'true')
        working-directory: kyc-terraform
        run: |
          pipx install prowler
          pipx install c7n
          curl -sL https://github.com/cloudquery/cloudquery/releases/latest/download/cloudquery_linux_amd64 -o /tmp/cloudquery
          chmod +x /tmp/cloudquery
          sudo mv /tmp/cloudquery /usr/local/bin/cloudquery
          sudo /bin/sh -c "$(curl -fsSL https://steampipe.io/install/steampipe.sh)"

      - name: Observe actual cloud state
        # Observed state loop: collect inventory, compliance, and audit-only remediation findings.
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.run_observed_state_scans == 'true')
        working-directory: kyc-terraform
        continue-on-error: true
        run: |
          mkdir -p security-reports/prowler security-reports/cloudquery security-reports/steampipe security-reports/custodian
          prowler aws --output-directory security-reports/prowler --status FAIL || true
          cloudquery sync security/cloudquery/aws-source.yml security/cloudquery/file-destination.yml || true
          steampipe plugin install aws
          steampipe query --output json "select account_id, users, groups, roles, policies from aws_iam_account_summary" > security-reports/steampipe/iam-account-summary.json || true
          custodian run --dryrun -s security-reports/custodian security/custodian/policies.yml || true

      - name: Upload observed-state reports
        # Upload observed-state outputs even when an earlier scan exits non-zero.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observed-state-reports
          path: kyc-terraform/security-reports/**
          if-no-files-found: ignore
